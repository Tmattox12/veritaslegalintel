<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
  <script src="matter-context.js"></script><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Income Imputation & Analysis - Veritas</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;color:#333}.header{background:#fff;border-bottom:1px solid #e0e0e0;padding:24px}.matter-info{font-size:13px;color:#666;margin-bottom:12px}.matter-name{font-size:20px;font-weight:600;color:#1c3f66}.subtitle{font-size:14px;color:#999;margin-top:4px}.container{max-width:1400px;margin:0 auto;padding:32px 24px}.section-title{font-size:28px;font-weight:700;color:#1c3f66;margin-bottom:8px}.section-desc{font-size:14px;color:#666;margin-bottom:32px}.income-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-bottom:32px}.income-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;position:relative}.income-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#1c3f66,#2c5aa0)}.income-card.spouse-b::before{background:linear-gradient(90deg,#2e7d5b,#4caf50)}.income-card.combined::before{background:linear-gradient(90deg,#8a6528,#d4a574)}.party-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#999;margin-bottom:8px}.party-name{font-size:13px;font-weight:600;color:#666;margin-bottom:16px}.income-amount{font-size:48px;font-weight:700;color:#1c3f66;margin-bottom:12px}.income-monthly{font-size:13px;color:#999;margin-bottom:16px}.income-percentage{display:inline-block;background:#e7edf5;color:#1c3f66;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}.income-breakdown{border-top:1px solid #f0f0f0;margin-top:16px;padding-top:16px;font-size:12px}.breakdown-item{display:flex;justify-content:space-between;margin-bottom:8px}.section-box{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;margin-bottom:32px}.section-box h3{font-size:16px;font-weight:600;color:#1c3f66;margin-bottom:16px}.source-table{width:100%;border-collapse:collapse;font-size:13px}.source-table th{background:#f5f5f5;padding:12px;text-align:left;font-weight:600;border-bottom:1px solid #e0e0e0}.source-table td{padding:12px;border-bottom:1px solid #f0f0f0}.amount-value{font-weight:600;color:#1c3f66}.loading{text-align:center;padding:40px;color:#999}.error{background:#ffebee;color:#c62828;padding:16px;border-radius:8px;margin-bottom:24px;border-left:4px solid #c62828}</style></head><body><div class="header"><div class="matter-info">ACTIVE MATTER</div><div class="matter-name" id="matterName">—</div><div class="subtitle" id="matterDetails">Loading...</div></div><div class="container"><h1 class="section-title">Income Imputation & Analysis</h1><p class="section-desc">Evaluate claimed vs. actual vs. imputable income · identify discrepancies · build defense</p><div id="errorContainer"></div><div id="loadingState" class="loading">Loading income data from discovery documents...</div><div id="contentArea" style="display: none;"><div class="income-grid" id="incomeCardsContainer"></div><div class="section-box"><h3>📊 Income By Source</h3><table class="source-table"><thead><tr><th>Party</th><th>Source</th><th>Annual Amount</th><th>Monthly Amount</th></tr></thead><tbody id="sourceTableBody"><tr><td colspan="4" style="text-align: center; color: #999; padding: 40px;">Loading sources...</td></tr></tbody></table></div></div></div><script>function formatCurrency(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:0}).format(n||0)}function formatMonthly(n){return formatCurrency((n||0)/12)}async function loadIncomeData(){const matterId=new URLSearchParams(window.location.search).get("matter")||localStorage.getItem("currentMatterId");if(!matterId){document.getElementById("errorContainer").innerHTML='<div class="error">No matter selected</div>';document.getElementById("loadingState").style.display="none";return}try{const matterResp=await fetch(`http://localhost:3000/api/matters/${matterId}`);const matter=await matterResp.json();document.getElementById("matterName").textContent=matter.name||"—";document.getElementById("matterDetails").textContent=[matter.case_no,matter.county,matter.state].filter(Boolean).join(" · ")||"No details";const incomeResp=await fetch(`http://localhost:3000/api/matters/${matterId}/income-data`);const incomeData=await incomeResp.json();document.getElementById("loadingState").style.display="none";document.getElementById("contentArea").style.display="block";const parties=incomeData.parties||[];const combined=parties.reduce((sum,p)=>sum+(p.annual||0),0);let cardsHtml="";parties.forEach((party,idx)=>{const percent=combined>0?Math.round(party.annual/combined*100):0;const cls=0===idx?"":"spouse-b";cardsHtml+=`<div class="income-card ${cls}"><div class="party-label">${0===idx?"PETITIONER":"RESPONDENT"}</div><div class="party-name">${party.name}</div><div class="income-amount">${formatCurrency(party.annual)}</div><div class="income-monthly">${formatMonthly(party.annual)}/mo</div><div class="income-percentage">${percent}% of combined</div><div class="income-breakdown">${(party.sources||[]).map(s=>`<div class="breakdown-item"><span>${s.source}</span><span><strong>${formatCurrency(s.amount)}</strong></span></div>`).join("")}</div></div>`});if(combined>0){const pct1=parties[0]?Math.round(parties[0].annual/combined*100):0;const pct2=parties[1]?Math.round(parties[1].annual/combined*100):0;cardsHtml+=`<div class="income-card combined"><div class="party-label">COMBINED INCOME</div><div class="party-name">Both Parties</div><div class="income-amount">${formatCurrency(combined)}</div><div class="income-monthly">${formatMonthly(combined)}/mo</div><div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.1);"><div class="breakdown-item"><span>Income share</span><span><strong>${pct1}% · ${pct2}%</strong></span></div></div></div>`}document.getElementById("incomeCardsContainer").innerHTML=cardsHtml;const sources=incomeData.sources||[];const tableHtml=0===sources.length?'<tr><td colspan="4" style="text-align: center; color: #999; padding: 40px;">No income sources found</td></tr>':sources.map(s=>`<tr><td>${s.type}</td><td>${s.description}</td><td class="amount-value">${formatCurrency(s.annual)}</td><td class="amount-value">${formatMonthly(s.annual)}</td></tr>`).join("");document.getElementById("sourceTableBody").innerHTML=tableHtml}catch(error){document.getElementById("errorContainer").innerHTML=`<div class="error">Error: ${error.message}</div>`;document.getElementById("loadingState").style.display="none"}}document.addEventListener("DOMContentLoaded",loadIncomeData)</script></body></html>
