<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="matter-context.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Veritas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .dash-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .dash-group { margin: 26px 0 12px; display: flex; align-items: baseline; gap: 12px; }
    .dash-group h2 { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; color: var(--navy-900); }
    .dash-group .hint { font-size: 12.5px; color: var(--mute); }
    .dash-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    a.mod-card { display: block; color: inherit; text-decoration: none; }
    .mod-card .mod-status { font-size: 12px; color: var(--navy-700); font-weight: 600; border-top: 1px solid var(--line-soft); padding-top: 10px; min-height: 28px; }
    .mod-card .mod-status.warn { color: #8a5a12; }
    .mod-card .mod-status.muted { color: var(--mute); font-weight: 500; }
    .mod-badge.ok { background: var(--green-soft); color: var(--green); }
    .mod-badge.todo { background: var(--amber-soft); color: #7a5414; }
    .mod-badge.info { background: #e8eef7; color: var(--navy-600); }
    .callout { padding: 12px 14px; border-left: 4px solid var(--red); background: var(--red-soft); color: #7a2b1f; border-radius: 6px; font-size: 13px; line-height: 1.55; margin-bottom: 18px; }
    .dash-foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--mute); }
    @media (max-width: 1100px) { .dash-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dash-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .dash-grid, .dash-kpis { grid-template-columns: 1fr; } .page-head { flex-direction: column; align-items: flex-start; gap: 12px; } }
  </style>
</head>
<body>
  <aside class="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div class="matter-switcher">
        <span class="matter-label">Active Matter</span>
        <button class="matter-btn"><strong>Loading client…</strong><span class="chev">▾</span></button>
      </div>
    </header>

    <div class="content">
      <section class="page-head">
        <div>
          <h1>Dashboard</h1>
          <div class="sub">Everything for the selected client, in the order the work is done.</div>
        </div>
        <div class="head-actions">
          <a class="btn ghost" href="case-intake.html" style="text-decoration:none;">New client</a>
          <a class="btn primary" href="discovery-intake.html" style="text-decoration:none;">Upload documents</a>
        </div>
      </section>

      <div id="status"></div>

      <div class="kpi-row dash-kpis" id="kpis">
        <div class="kpi"><span class="kpi-label">Documents</span><span class="kpi-value" id="kDocs">—</span><span class="kpi-delta" id="kDocsSub">&nbsp;</span></div>
        <div class="kpi"><span class="kpi-label">Statements parsed</span><span class="kpi-value" id="kStmts">—</span><span class="kpi-delta" id="kStmtsSub">&nbsp;</span></div>
        <div class="kpi"><span class="kpi-label">Accepted income</span><span class="kpi-value" id="kIncome">—</span><span class="kpi-delta" id="kIncomeSub">&nbsp;</span></div>
        <div class="kpi"><span class="kpi-label">Trust balance</span><span class="kpi-value" id="kTrust">—</span><span class="kpi-delta" id="kTrustSub">&nbsp;</span></div>
      </div>

      <div id="groups"></div>

      <div class="dash-foot">
        <span>Veritas · Family Law Financial Intelligence</span>
        <span>Arizona guidelines · Work product — privileged &amp; confidential</span>
      </div>
    </div>
  </main>

  <script src="safe-text.js"></script>
  <script>
  (function () {
    const API = window.API_BASE;
    const esc = window.renderSafeText;
    const money = (n) => (Number(n) || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    const matterId = () => (window.VeritasMatter && window.VeritasMatter.id) || null;

    // The master template: every module, grouped in the order the work is done.
    // status(d) returns [text, tone] from the live data for this client.
    const GROUPS = [
      { title: 'Intake & setup', hint: 'Start here for a new client', cards: [
        { href: 'case-intake.html', ico: '🗂️', bg: '#eef4fb', title: 'Case Intake', text: 'Parties, case number, county, marriage and service dates. Every page reads the case details from here.',
          status: (d) => d.matter ? [[d.matter.case_no && `No. ${d.matter.case_no}`, [d.matter.county, d.matter.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ') || 'Add case number and county', 'info'] : null },
        { href: 'discovery-intake.html', ico: '📥', bg: '#e3f2ea', title: 'Document Intake', text: 'Upload discovery files. Each one is read, classified, and bank statements are parsed into transactions.',
          status: (d) => d.summary ? [`${d.summary.documentCount} documents · ${d.summary.transactionCount.toLocaleString()} transactions`, d.summary.documentCount ? 'ok' : 'todo'] : null },
        { href: 'document-hub-master.html', ico: '📚', bg: '#f4ead6', title: 'Document Hubs', text: 'Documents filed by category — income, expenses, tax, assets, real estate, retirement, liabilities, legal.',
          status: (d) => d.income ? (d.income.intake.unclassifiedDocuments ? [`${d.income.intake.unclassifiedDocuments} documents still unclassified`, 'todo'] : ['All documents classified', 'ok']) : null },
      ] },
      { title: 'Income & expenses', hint: 'Review what the documents show', cards: [
        { href: 'document-hub-income.html', ico: '💵', bg: '#e3f2ea', title: 'Income Hub', text: 'Assign pay stubs, benefit statements, and tax records to a party and accept them. Only accepted income is used in calculations.',
          status: (d) => d.summary ? (d.summary.acceptedIncomeEvidence.length ? [`${d.summary.acceptedIncomeEvidence.length} documents accepted · ${money(d.summary.acceptedIncomeAnnual)}/yr`, 'ok'] : ['No income accepted yet', 'todo']) : null },
        { href: 'income-engine-builder.html', ico: '🔨', bg: '#eef4fb', title: 'Income Engine', text: 'Build each party’s income by source — W-2, bonus, RSU, self-employment, rental, benefits — and compare.', status: () => ['Builder mode', 'info'] },
        { href: 'document-hub-expenses.html', ico: '🧾', bg: '#fbe7e2', title: 'Expense Hub', text: 'Reconcile parsed bank and card transactions against what reaches expense mapping.',
          status: (d) => d.expense ? [`${d.expense.outflows.mappable.count.toLocaleString()} expense transactions to map`, d.expense.outflows.mappable.count ? 'info' : 'ok'] : null },
        { href: 'afi.html', ico: '📋', bg: '#f4ead6', title: 'AFI Expenses', text: 'Affidavit of Financial Information expenses by section, with monthly averages from the statements.', status: () => null },
        { href: 'forensic-tracing.html', ico: '🔍', bg: '#eef1f7', title: 'Forensic Tracing', text: 'Trace transfers between accounts and community vs. separate funds.', status: () => null },
        { href: 'red-flags.html', ico: '🚩', bg: '#fbe7e2', title: 'Red-Flag Detection', text: 'Large transfers, undisclosed accounts, round-trips, and missing statement periods.', status: () => null },
      ] },
      { title: 'Support & property', hint: 'Calculations for the case', cards: [
        { href: 'spousal.html', ico: '⚖️', bg: '#eef4fb', title: 'Spousal Maintenance', text: 'Arizona spousal maintenance guidelines — amount and duration ranges.', status: () => ['A.R.S. § 25-319', 'info'] },
        { href: 'child-support.html', ico: '👶', bg: '#e3f2ea', title: 'Child Support', text: 'Arizona income-shares guideline with parenting time and add-ons.', status: () => ['A.R.S. § 25-320', 'info'] },
        { href: 'equitable-distribution.html', ico: '🏠', bg: '#f4ead6', title: 'Asset Division', text: 'Community and separate property, valuation, and equalization.', status: () => ['A.R.S. § 25-318', 'info'] },
        { href: 'rsu.html', ico: '📈', bg: '#f5eefa', title: 'RSU / Stock Analysis', text: 'Table 1 account ledger and Table 2 unvested tranches — Hug vs. Nelson apportionment.', status: () => null },
        { href: 'settlement.html', ico: '🤝', bg: '#eef1f7', title: 'Settlement Modeling', text: 'Compare settlement scenarios across support and property.', status: () => null },
      ] },
      { title: 'Billing & reports', hint: 'Time, retainer, and output', cards: [
        { href: 'billing.html', ico: '⏱️', bg: '#e3f2ea', title: 'Billing & Trust', text: 'Time captured while working, draft entries to approve, the retainer in trust, and statements.',
          status: (d) => d.billing ? (d.billing.alerts.workingAtRisk ? ['Working at risk — unbilled work exceeds trust', 'warn']
            : d.billing.alerts.belowEvergreen && d.billing.trust.balance > 0 ? ['Retainer below evergreen minimum', 'warn']
            : [`${money(d.billing.wip.total)} unbilled · ${d.billing.uncapturedMinutes} min not yet drafted`, 'info']) : null },
        { href: 'estate.html', ico: '📄', bg: '#eef4fb', title: 'Reports', text: 'Summaries and exhibits for the client, opposing counsel, and the court.', status: () => null },
        { href: 'regulations.html', ico: '📖', bg: '#f4ead6', title: 'Regulations', text: 'Arizona statutes and guidelines referenced across the modules.', status: () => null },
      ] },
    ];

    function render(d) {
      document.getElementById('groups').innerHTML = GROUPS.map((g) => `
        <div class="dash-group"><h2>${esc(g.title)}</h2><span class="hint">${esc(g.hint)}</span></div>
        <div class="dash-grid">${g.cards.map((c) => {
          let s = null;
          try { s = c.status(d); } catch (e) { s = null; }
          const [text, tone] = s || [d.offline ? 'Backend offline' : 'Open module', 'muted'];
          return `<a class="mod-card" href="${c.href}">
            <div class="mod-top"><div class="mod-ico" style="background:${c.bg}">${c.ico}</div></div>
            <h4>${esc(c.title)}</h4>
            <p>${esc(c.text)}</p>
            <div class="mod-status ${tone === 'warn' || tone === 'todo' ? 'warn' : tone === 'muted' ? 'muted' : ''}">${esc(text)}</div>
          </a>`;
        }).join('')}</div>`).join('');
    }

    function renderKpis(d) {
      const set = (id, v) => { document.getElementById(id).textContent = v; };
      if (d.summary) {
        set('kDocs', d.summary.documentCount.toLocaleString());
        set('kDocsSub', d.income ? `${d.income.intake.unclassifiedDocuments} unclassified` : '');
        set('kStmts', d.summary.statementCount.toLocaleString());
        set('kStmtsSub', `${d.summary.coverageMonths} months covered · ${d.summary.transactionCount.toLocaleString()} transactions`);
        set('kIncome', money(d.summary.acceptedIncomeAnnual));
        set('kIncomeSub', d.summary.acceptedIncomeEvidence.length ? `${d.summary.acceptedIncomeEvidence.length} documents accepted, annual` : 'None accepted yet — see Income Hub');
      }
      if (d.billing) {
        set('kTrust', money(d.billing.trust.balance));
        set('kTrustSub', `${money(d.billing.wip.total)} unbilled work`);
      }
    }

    async function load() {
      const id = matterId();
      render({});
      if (!id) return;
      const base = `${API}/matters/${encodeURIComponent(id)}`;
      const get = (p) => fetch(base + p).then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))));
      const [summary, income, expense, billing] = await Promise.allSettled([get('/analysis-summary'), get('/income-hub'), get('/expense-hub'), get('/billing/summary')]);
      const val = (x) => (x.status === 'fulfilled' ? x.value : null);
      const d = { summary: val(summary), income: val(income), expense: val(expense), billing: val(billing), matter: (window.VeritasMatter || {}).matter };
      d.offline = !d.summary && !d.income && !d.expense && !d.billing;
      document.getElementById('status').innerHTML = d.offline
        ? '<div class="callout"><strong>Can’t reach the Veritas backend.</strong> Your data is safe — the server just isn’t running. Double-click <strong>start-veritas.bat</strong>, leave that window open, then reload this page.</div>'
        : '';
      renderKpis(d);
      render(d);
      window.addEventListener('veritas:matter', (e) => { d.matter = e.detail.matter; render(d); });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
    else load();
  })();
  </script>
  <script src="veritas-auth.js"></script>
  <script src="sidebar-loader.js"></script>
</body>
</html>
